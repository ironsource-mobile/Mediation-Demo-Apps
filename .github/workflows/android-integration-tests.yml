name: Android Integration Tests

on:
  pull_request:
    paths:
      - 'Android/**'
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'LevelPlay SDK version (blank = use project default)'
        required: false
        type: string
        default: ''
      api_level:
        description: 'Android emulator API level'
        required: false
        type: string
        default: '29'
      target_sdk_version:
        description: 'Android target + compiled SDK version'
        required: false
        type: string
        default: '34'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Kotlin, Java]

    env:
      PRIVATE_MAVEN_USERNAME: ${{ secrets.PRIVATE_MAVEN_USERNAME }}
      PRIVATE_MAVEN_PASSWORD: ${{ secrets.PRIVATE_MAVEN_PASSWORD }}

    defaults:
      run:
        working-directory: Android/${{ matrix.project }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve build args
        id: args
        run: |
          SDK_ARG=""
          if [ -n "${{ inputs.sdk_version }}" ]; then
            SDK_ARG="-PsdkVersion=${{ inputs.sdk_version }}"
          fi
          TARGET_ARG=""
          if [ -n "${{ inputs.target_sdk_version }}" ]; then
            TARGET_ARG="-PtargetSdkVersion=${{ inputs.target_sdk_version }} -PcompileSdkVersion=${{ inputs.target_sdk_version }}"
          fi
          API_LEVEL="${{ inputs.api_level }}"
          if [ -z "$API_LEVEL" ]; then API_LEVEL="29"; fi
          # Android 17 (API 37) is only published under feature-drop names
          # (system-images;android-37.0/-37.1), not bare `android-37`. Map here.
          case "$API_LEVEL" in
            37) SYS_IMAGE_LEVEL="37.0" ;;
            *)  SYS_IMAGE_LEVEL="$API_LEVEL" ;;
          esac
          SYS_IMAGE="system-images;android-$SYS_IMAGE_LEVEL;default;x86_64"
          echo "sdk_arg=$SDK_ARG" >> $GITHUB_OUTPUT
          echo "target_arg=$TARGET_ARG" >> $GITHUB_OUTPUT
          echo "api_level=$API_LEVEL" >> $GITHUB_OUTPUT
          echo "sys_image=$SYS_IMAGE" >> $GITHUB_OUTPUT

      - name: Build debug and test APKs
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest \
            ${{ steps.args.outputs.sdk_arg }} \
            ${{ steps.args.outputs.target_arg }} \
            --stacktrace

      - name: Install emulator + system image
        working-directory: .
        env:
          SYS_IMAGE: ${{ steps.args.outputs.sys_image }}
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "emulator" "$SYS_IMAGE"

      - name: Create AVD
        working-directory: .
        env:
          SYS_IMAGE: ${{ steps.args.outputs.sys_image }}
        run: echo "no" | avdmanager create avd -n test -k "$SYS_IMAGE" --force

      - name: Boot emulator (background)
        working-directory: .
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd test \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect \
            > /tmp/emulator.log 2>&1 &
          echo "emulator started (pid $!)"

      - name: Wait for emulator boot
        working-directory: .
        run: |
          adb wait-for-device
          BOOT_TIMEOUT=600
          ELAPSED=0
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if [ "$ELAPSED" -ge "$BOOT_TIMEOUT" ]; then
              echo "boot timeout after ${BOOT_TIMEOUT}s"
              tail -100 /tmp/emulator.log
              exit 1
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
          echo "emulator booted after ${ELAPSED}s"
          echo "release: $(adb shell getprop ro.build.version.release | tr -d '\r')"
          echo "sdk: $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          adb shell input keyevent 82

      - name: Run integration tests
        run: ./gradlew connectedDebugAndroidTest ${{ steps.args.outputs.sdk_arg }} ${{ steps.args.outputs.target_arg }} --stacktrace

      - name: Kill emulator
        if: always()
        working-directory: .
        run: adb emu kill 2>&1 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.project }}-api${{ steps.args.outputs.api_level }}
          path: |
            Android/${{ matrix.project }}/app/build/reports/androidTests/
            Android/${{ matrix.project }}/app/build/outputs/androidTest-results/
          retention-days: 7
