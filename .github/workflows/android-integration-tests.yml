name: Android Integration Tests

on:
  pull_request:
    paths:
      - 'Android/**'
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'LevelPlay SDK version (blank = use project default)'
        required: false
        type: string
        default: ''
      api_level:
        description: 'Android emulator API level'
        required: false
        type: string
        default: '29'
      target_sdk_version:
        description: 'Android target + compiled SDK version'
        required: false
        type: string
        default: '34'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Kotlin, Java]

    env:
      PRIVATE_MAVEN_USERNAME: ${{ secrets.PRIVATE_MAVEN_USERNAME }}
      PRIVATE_MAVEN_PASSWORD: ${{ secrets.PRIVATE_MAVEN_PASSWORD }}

    defaults:
      run:
        working-directory: Android/${{ matrix.project }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Debug Android SDK state
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "---installed platforms---"
          ls -1 "$ANDROID_HOME/platforms" 2>&1 || echo "no platforms dir"
          echo "---sdkmanager list installed (platforms only)---"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>&1 | grep -E '^\s*platforms;' | head -20

      - name: Install requested Android platform SDK
        env:
          TARGET_SDK: ${{ inputs.target_sdk_version }}
        run: |
          TARGET="${TARGET_SDK:-34}"
          echo "Requesting platforms;android-$TARGET"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$TARGET"
          echo "---after install---"
          ls -1 "$ANDROID_HOME/platforms" 2>&1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve build args
        id: args
        run: |
          SDK_ARG=""
          if [ -n "${{ inputs.sdk_version }}" ]; then
            SDK_ARG="-PsdkVersion=${{ inputs.sdk_version }}"
          fi
          TARGET_ARG=""
          if [ -n "${{ inputs.target_sdk_version }}" ]; then
            TARGET_ARG="-PtargetSdkVersion=${{ inputs.target_sdk_version }} -PcompileSdkVersion=${{ inputs.target_sdk_version }}"
          fi
          API_LEVEL="${{ inputs.api_level }}"
          if [ -z "$API_LEVEL" ]; then API_LEVEL="29"; fi
          echo "sdk_arg=$SDK_ARG" >> $GITHUB_OUTPUT
          echo "target_arg=$TARGET_ARG" >> $GITHUB_OUTPUT
          echo "api_level=$API_LEVEL" >> $GITHUB_OUTPUT

      - name: Build debug and test APKs
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest \
            ${{ steps.args.outputs.sdk_arg }} \
            ${{ steps.args.outputs.target_arg }} \
            --stacktrace

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.args.outputs.api_level }}
          arch: x86_64
          script: cd Android/${{ matrix.project }} && ./gradlew connectedDebugAndroidTest ${{ steps.args.outputs.sdk_arg }} ${{ steps.args.outputs.target_arg }} --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.project }}-api${{ steps.args.outputs.api_level }}
          path: |
            Android/${{ matrix.project }}/app/build/reports/androidTests/
            Android/${{ matrix.project }}/app/build/outputs/androidTest-results/
          retention-days: 7
