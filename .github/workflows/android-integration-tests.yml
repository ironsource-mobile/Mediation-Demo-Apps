name: Android Integration Tests

on:
  pull_request:
    paths:
      - 'Android/**'
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'LevelPlay SDK version (blank = use project default)'
        required: false
        type: string
        default: ''
      api_level:
        description: 'Android emulator API level'
        required: false
        type: string
        default: '29'
      target_sdk_version:
        description: 'Android target + compiled SDK version'
        required: false
        type: string
        default: '34'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Kotlin, Java]

    env:
      PRIVATE_MAVEN_USERNAME: ${{ secrets.PRIVATE_MAVEN_USERNAME }}
      PRIVATE_MAVEN_PASSWORD: ${{ secrets.PRIVATE_MAVEN_PASSWORD }}

    defaults:
      run:
        working-directory: Android/${{ matrix.project }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve build args
        id: args
        run: |
          SDK_ARG=""
          if [ -n "${{ inputs.sdk_version }}" ]; then
            SDK_ARG="-PsdkVersion=${{ inputs.sdk_version }}"
          fi
          TARGET_ARG=""
          if [ -n "${{ inputs.target_sdk_version }}" ]; then
            TARGET_ARG="-PtargetSdkVersion=${{ inputs.target_sdk_version }} -PcompileSdkVersion=${{ inputs.target_sdk_version }}"
          fi
          API_LEVEL="${{ inputs.api_level }}"
          if [ -z "$API_LEVEL" ]; then API_LEVEL="29"; fi
          # Android 17 uses feature-drop naming: no bare `platforms;android-37`
          # package exists in Google's SDK repo, only `platforms;android-37.0`
          # / `-37.1`. reactivecircus/android-emulator-runner@v2 interpolates
          # api-level directly into the package name, so pass the versioned
          # string here to make it install the right one.
          EMU_API_LEVEL="$API_LEVEL"
          if [ "$API_LEVEL" = "37" ]; then EMU_API_LEVEL="37.0"; fi
          echo "sdk_arg=$SDK_ARG" >> $GITHUB_OUTPUT
          echo "target_arg=$TARGET_ARG" >> $GITHUB_OUTPUT
          echo "api_level=$API_LEVEL" >> $GITHUB_OUTPUT
          echo "emu_api_level=$EMU_API_LEVEL" >> $GITHUB_OUTPUT

      - name: Build debug and test APKs
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest \
            ${{ steps.args.outputs.sdk_arg }} \
            ${{ steps.args.outputs.target_arg }} \
            --stacktrace

      # Workaround for API 37 feature-drop naming (Android 17):
      # older cmdline-tools / avdmanager fail on `platforms;android-37`
      # (no bare package exists — only 37.0 / 37.1) and write
      # `target=android-0` into AVD configs. Bumping to cmdline-tools 22.0
      # picks up native feature-drop support.
      # Pending upstream: reactivecircus/android-emulator-runner#483.
      - name: Upgrade cmdline-tools to 22.0 (for API 37 support)
        working-directory: .
        run: |
          if [ "${{ steps.args.outputs.api_level }}" -lt 37 ]; then
            echo "api_level < 37 — skipping cmdline-tools upgrade"
            exit 0
          fi
          echo "Downloading cmdline-tools 22.0 (build 15859902)"
          curl -sfLO https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q commandlinetools-linux-15859902_latest.zip -d /tmp/newcmd
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/newcmd/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          rm commandlinetools-linux-15859902_latest.zip
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.args.outputs.emu_api_level }}
          arch: x86_64
          script: cd Android/${{ matrix.project }} && ./gradlew connectedDebugAndroidTest ${{ steps.args.outputs.sdk_arg }} ${{ steps.args.outputs.target_arg }} --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.project }}-api${{ steps.args.outputs.api_level }}
          path: |
            Android/${{ matrix.project }}/app/build/reports/androidTests/
            Android/${{ matrix.project }}/app/build/outputs/androidTest-results/
          retention-days: 7
