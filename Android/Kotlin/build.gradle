// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

        def privateMavenUsername = System.getenv("PRIVATE_MAVEN_USERNAME") ?: ""
        def privateMavenPassword = System.getenv("PRIVATE_MAVEN_PASSWORD") ?: ""

        if (privateMavenUsername && privateMavenPassword) {
            maven {
                credentials {
                    username = privateMavenUsername
                    password = privateMavenPassword
                }
                url "https://raw.githubusercontent.com/ironsource-mobile/android-sdk-maven/master"
                authentication {
                    basic(BasicAuthentication)
                }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
